# /etc/nginx/sites-available/epiconnect  (symlinked into sites-enabled)
# TLS certificates are issued by Let's Encrypt (certbot --nginx) and renewed
# automatically by the certbot systemd timer.

upstream epiconnect_app {
    server 127.0.0.1:8000;   # Gunicorn — never exposed publicly
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name epiconnect.swedencentral.cloudapp.azure.com 4.223.163.106;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://epiconnect.swedencentral.cloudapp.azure.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name epiconnect.swedencentral.cloudapp.azure.com;

    ssl_certificate     /etc/letsencrypt/live/epiconnect.swedencentral.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epiconnect.swedencentral.cloudapp.azure.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 10M;

    # --- Security headers (securityheaders.com grade A) ---------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Tailwind is loaded from its CDN and configured inline, hence the
    # script/style exceptions. blob: is needed for the chat image preview.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- Static & media ------------------------------------------------------
    location /static/ {
        alias /var/www/EPIConnect/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/EPIConnect/media/;
        # User uploads: never let the browser treat them as HTML/JS
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        expires 7d;
    }

    # --- Internal endpoints: never public -----------------------------------
    location = /metrics { deny all; }

    # --- Application ---------------------------------------------------------
    location / {
        proxy_pass http://epiconnect_app;
        proxy_set_header Host              $host;
        # Overwrite (not append) so clients cannot spoof their IP
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
